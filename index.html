
<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ShootLog กินเที่ยวนอนอุดร</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
        color: #172033;
        background: #f4f6fb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 2rem 1rem;
      }

      main {
        width: min(100%, 960px);
        margin: 0 auto;
      }

      h1 {
        margin: 0 0 0.5rem;
        font-size: clamp(1.5rem, 4vw, 2rem);
      }

      p {
        color: #536078;
      }

      form {
        display: flex;
        gap: 0.75rem;
        margin: 1.5rem 0 0.5rem;
      }

      input {
        flex: 1;
        min-width: 0;
        padding: 0.75rem 1rem;
        border: 1px solid #cbd2e0;
        border-radius: 0.5rem;
        font: inherit;
      }

      button {
        padding: 0.75rem 1.25rem;
        border: 0;
        border-radius: 0.5rem;
        background: #2457d6;
        color: white;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }

      button:hover {
        background: #1946b9;
      }

      #message {
        min-height: 1.5rem;
        margin: 0 0 0.75rem;
        color: #a12622;
      }

      iframe {
        display: block;
        width: 100%;
        height: min(75vh, 900px);
        min-height: 480px;
        border: 1px solid #dce1eb;
        border-radius: 0.75rem;
        background: white;
      }

      @media (max-width: 600px) {
        body {
          padding: 1.25rem 0.75rem;
        }

        form {
          flex-direction: column;
        }

        button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>แสดงเนื้อหาจาก Google Apps Script</h1>
      <p>วาง URL ของ Web app จาก Google Apps Script แล้วกด “แสดง”</p>

      <form id="gas-form">
        <input
          id="gas-url"
          type="url"
          aria-label="URL ของ Google Apps Script"
          placeholder="https://script.google.com/macros/s/.../exec"
          required
        >
        <button type="submit">แสดง</button>
      </form>
      <p id="message" role="status" aria-live="polite"></p>

      <iframe id="gas-frame" title="เนื้อหาจาก Google Apps Script"></iframe>
    </main>

    <script>
      const defaultUrl =
        "https://script.google.com/macros/s/AKfycbxtlNPDEMMzJoeBwChNxu8Tcm9wEflScmrYbxxRTdDSeMES-lFFzdhFqQzitMVTnngP/exec";
      const form = document.querySelector("#gas-form");
      const input = document.querySelector("#gas-url");
      const frame = document.querySelector("#gas-frame");
      const message = document.querySelector("#message");

      function showGasApp(value) {
        let url;

        try {
          url = new URL(value);
        } catch {
          message.textContent = "กรุณาตรวจสอบ URL แล้วลองอีกครั้ง";
          return;
        }

        if (
          url.protocol !== "https:" ||
          url.hostname !== "script.google.com" ||
          !/^\/macros\/s\/[^/]+\/(?:exec|dev)\/?$/.test(url.pathname)
        ) {
          message.textContent =
            "กรุณาใช้ URL Web app ของ Google Apps Script ที่ลงท้ายด้วย /exec หรือ /dev";
          return;
        }

        message.textContent = "";
        frame.src = url.href;
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        showGasApp(input.value.trim());
      });

      input.value = defaultUrl;
      showGasApp(defaultUrl);
    </script>
  </body>
</html>
